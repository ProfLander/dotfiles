[package]
name = "input-history"
version = "0.1.0"
edition = "2021"

[dependencies]
evdev = { version = "0.13.2", features = ["serde"] }
xkbcommon = "0.9.0"
ordermap = "1.0.0"
clap = { version = "4.5.53", features = ["derive"] }
crossterm = "0.29.0"
toml = "0.9.9"
nix = { version = "0.30.1", features = ["event"] }
serde = { version = "1.0", features = ["derive"] }
serde_with = "3.16.1"
utf8_slice = "1.0.0"
nu-ansi-term = { version = "0.50.3", features = ["derive_serde_style"] }

